# Example .code-reducer.yaml for analyzing Go projects
model_id: "ornith:9b"
ollama_base_url: "http://localhost:11434"
ollama_num_ctx: 8192
docs_dir: "wiki"

# ornith:9b is a reasoning model. With think: true it charges its hidden
# reasoning against every generation budget, which slows every call and can
# leave a slot answer with no visible content. Keep it false.
think: false

# Client-wide generation cap. 0 lets Ollama decide, which only bounds the fact
# extraction calls: every documentation slot is capped by its own per-kind cap
# below. A value lower than a per-kind cap caps that cap as well.
num_predict: 0

# Generation caps for the documentation prose slots, the shipped defaults. The
# page structure is written by the engine, so these are ceilings a well-behaved
# answer never reaches: a one-line slot measures 34 tokens and a paragraph slot
# 63 with think: false.
slot_num_predict: 192
paragraph_num_predict: 1024

# System Prompt defines the AI persona
system_prompt: |
  You are Code-Reducer, an expert technical writer and Go code analyzer. Your job is to strictly follow instructions. You do not yap, you do not write filler.
  DEFENSIVE RULES: 
  1. Do NOT use absolute terms ('always', 'never', 'zero') unless explicitly proven. 
  2. Do NOT guess downstream consequences or invent unhandled paths. If an error is swallowed, just say it is swallowed. 
  3. Do NOT name standard library packages unless explicitly stated in the source text. 
  4. Only report facts you are 100% sure about.

# Prose style applied to every slot of a module page. The engine writes the page
# skeleton, so these prompts must never ask the model for structure.
module_synthesis_prompt: |
  Task: Write the prose for one slot of a module documentation page.
  Rule 1: The headings, their order and the component names are already fixed by the tooling. Never emit headings, lists, code fences or any other structure.
  Rule 2: Answer with the requested slot text only, dense and technical, and keep it as short as the slot instruction asks.
  Rule 3: Use only the supplied facts, and say nothing about code you were not shown.

architecture_prompt: |
  Task: Write the prose for one slot of a project documentation page (architecture or quickstart).
  Rule 1: The title, the headings and their order are already fixed by the tooling. Never emit headings, lists, code fences or any other structure.
  Rule 2: Answer with the requested slot text only, dense and developer-friendly, and keep it as short as the slot instruction asks.
  Rule 3: Use only the supplied module summaries, and never invent a module, a command or a workflow you were not shown.

file_fact_consolidation_prompt: |
  You are a specialized code documentation assistant. Consolidate, deduplicate and merge the following facts extracted from different chunks of the same file into a single, cohesive summary.

# Custom extraction steps during map phase
extraction_steps:
  - name: "API_SIGNATURES"
    prompt: |
      Task: Extract the public surface area of the file.
      Output: A strict Markdown list of all exported structs, interfaces, and methods. For each, note the actual input and output types. Ignore internal logic.
  - name: "BUSINESS_LOGIC"
    prompt: |
      Task: Analyze the business logic and domain concepts.
      Output: Explain what business rules or domain concepts this file solves. Describe the high-level algorithmic flow. Ignore implementation details.
  - name: "STATE_AND_CONCURRENCY"
    prompt: |
      Task: Analyze state mutation and concurrency.
      Output: List all mutable state (global variables, changing struct fields) and what concurrency mechanisms (e.g., sync.Mutex, channels) protect them. If none, state 'No mutable state'.
  - name: "ERRORS_AND_SIDE_EFFECTS"
    prompt: |
      Task: Analyze side effects and error handling.
      Output: Detail how this code communicates with the outside world (I/O like network, disk, DB) and how it handles/returns errors (wrap, sentinel, panic).
