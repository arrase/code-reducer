# Example .code-reducer.yaml for analyzing Terraform infrastructure projects
model_id: "ornith:9b"
ollama_base_url: "http://localhost:11434"
ollama_num_ctx: 8192
docs_dir: "wiki"

# Reasoning output. Reasoning models such as ornith:9b charge their hidden
# thinking against every generation budget when this is true, which slows every
# call and can leave a slot answer with no visible content. Keep it false.
think: false

# Client-wide generation cap. 0 lets Ollama decide, which only bounds the fact
# extraction calls: every documentation slot is capped by its own per-kind cap
# below. A value lower than a per-kind cap caps that cap as well.
num_predict: 0

# Generation caps for the documentation prose slots, the shipped defaults. The
# page structure is written by the engine, so these are ceilings a well-behaved
# answer never reaches: a one-line slot measures 34 tokens and a paragraph slot
# 63 with think: false.
slot_num_predict: 192
paragraph_num_predict: 1024

# Tell the LLM to behave as a Cloud Architect and IaC analyzer
system_prompt: |
  You are Code-Reducer, an expert Cloud Architect and Terraform infrastructure analyzer. Your job is to strictly follow instructions. You do not yap, you do not write filler.
  DEFENSIVE RULES: 
  1. Do NOT assume resources exist unless explicitly declared in the configuration.
  2. Do NOT guess downstream resource side effects unless directly linked (e.g., via security group attachments or subnet associations).
  3. Only report resource definitions and configurations you are 100% sure about.

# Prose style for every slot of a module page (which represents an infrastructure
# sub-component). The engine owns the headings, their order and the component names,
# so this prompt must never ask the model for structure.
module_synthesis_prompt: |
  Task: Write the prose for one slot of a Terraform module documentation page.
  Rule 1: The headings, their order and the resource names are already fixed by the tooling. Never emit headings, lists, code fences or any other structure.
  Rule 2: Answer with the requested slot text only, dense and technical, and keep it as short as the slot instruction asks.
  Rule 3: Only report resources, variables and modules that appear in the supplied facts.

# Prose style for every section of the global infrastructure overview pages
architecture_prompt: |
  Task: Write the prose for one slot of a cloud architecture or quickstart page.
  Rule 1: The title, the headings and their order are already fixed by the tooling. Never emit headings, lists, code fences or any other structure.
  Rule 2: Cover cloud topology, provider requirements, inter-module networking and the standard Terraform deployment commands, as densely as the slot instruction allows.
  Rule 3: Never invent a resource, provider or command you were not shown.

file_fact_consolidation_prompt: |
  You are a specialized infrastructure documentation assistant. Consolidate, deduplicate and merge the following facts extracted from different chunks of the same Terraform file into a single, cohesive summary.

# Custom extraction steps during map phase
extraction_steps:
  - name: "PROVISIONED_RESOURCES"
    prompt: |
      Task: Extract resources and data sources defined in this file.
      Output: A strict Markdown list of all resources (`resource "type" "name"`) and data sources (`data "type" "name"`). Note key parameters (e.g. instance type, VPC CIDR, backend configurations).
  - name: "VARIABLES_AND_OUTPUTS"
    prompt: |
      Task: Analyze input variables, outputs, and local variables.
      Output: List all input variables (with types and default values) and outputs exported by this file. Mention any complex local variables (`locals`) that define key configurations.
  - name: "MODULE_DEPENDENCIES"
    prompt: |
      Task: Analyze sub-module usage.
      Output: Identify any external or internal modules called in this file (`module "name"`), their source paths, and the key inputs passed to them.
  - name: "IAM_AND_SECURITY"
    prompt: |
      Task: Analyze permissions, IAM roles, and security groups.
      Output: Detail security groups, firewall rules, IAM roles, policies, and KMS keys defined in this file. Outline what access permissions or network paths they allow.

# Ignore Terraform state, local plugins, and lock files
ignore:
  - ".terraform"
  - "*.tfstate"
  - "*.tfstate.backup"
  - ".terraform.lock.hcl"
